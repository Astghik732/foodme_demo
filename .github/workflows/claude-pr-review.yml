# Automated PR code review by Claude Code.
#
# Required repo secret (Settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN - generated locally with `claude setup-token`
#   (uses your Claude subscription). To use an API key instead, replace the
#   `claude_code_oauth_token` line below with
#   `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.
#
# Fork PRs do not receive repo secrets, so this job only runs for PRs opened
# from branches in this repository.
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude code review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Use `gh pr diff` and `gh pr view` to read it, and read
            the surrounding code and the repo's CLAUDE.md and `.agents/rules/*.md`
            (backend-architecture, web-architecture, admin-architecture) before judging.

            Focus on, in order:
            1. Correctness bugs and regressions (logic errors, null handling, off-by-one,
               transaction/concurrency problems, broken API contracts such as the admin
               `{list, count}` shape or DTO field-name mappings).
            2. Security: auth/authorization gaps (the SecurityConfig rule order is
               first-match-wins), injection, XSS (e.g. `dangerouslySetInnerHTML`), secrets in
               code, sensitive data in logs or error bodies.
            3. Data safety: Flyway migrations (new `V<n>__` file, never edit an applied one),
               constraints, backwards compatibility with existing data.
            4. Repo conventions: constructor injection, `mapEntityToDto`/`mapDtoToEntity`,
               the safe load-mutate-save update pattern, `@/` import alias, zod schemas in
               `schemas/`, API calls in `api/foodme.ts`.
            5. Frontend quality: accessibility, error and loading states, mobile layout.

            Ignore pure style nits. Do not repeat what automated lint already enforces.
            Note that `FM-BUG-*` / `FM-FLAKE-*` comments mark intentionally seeded workshop
            issues: mention them only if the PR touches that code.

            Post specific problems as inline comments on the exact lines with
            `mcp__github_inline_comment__create_inline_comment`. Then post ONE top-level
            summary comment with `gh pr comment` that has: a one-paragraph summary of the
            change, a "Must fix" list, a "Should consider" list, and a clear verdict
            (approve / request changes). If you find nothing, say so briefly. Be concise and
            cite file:line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
