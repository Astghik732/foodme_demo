# Automated TEST review by Claude Code. The review itself is defined by the project skill
# `reviewing-test-cases` (.claude/skills/reviewing-test-cases/SKILL.md -> ISTQB review
# criteria, severity levels, report format and inline-comment rules). This workflow only
# tells Claude to load and follow that skill, so edit the skill, not this file, to change
# how tests are reviewed.
#
# Runs automatically on PRs touching apps/**, or manually: Actions > Claude Test Review >
# Run workflow, then enter the PR number.
#
# Required repo secret: CLAUDE_CODE_OAUTH_TOKEN (see claude-code-review.yml).
# NOTE: the skill file must exist on the branch this workflow checks out (it is on main).
name: Claude Test Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/**"
      - "!apps/**/*.md"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

concurrency:
  group: claude-test-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  test-review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Manual runs check out the PR's merge ref; PR events use the default ref.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr_number) || '' }}

      - name: Make sure the skill is present
        run: test -f .claude/skills/reviewing-test-cases/SKILL.md

      - name: Claude test review (skill reviewing-test-cases)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ env.PR_NUMBER }}

            Use the `reviewing-test-cases` skill (invoke it with the Skill tool, or if that is
            unavailable read `.claude/skills/reviewing-test-cases/SKILL.md` in full) and run it
            in CI MODE exactly as the skill describes. This is an unattended run: do not ask
            questions.

            Report exactly two things about this pull request:
            1. BAD TESTS - tests added/changed in the PR that are written badly.
            2. MISSING TESTS - behaviors the PR adds or changes (and the acceptance criteria of
               its Jira story/PRD) that no test covers, as concrete test cases.

            Get the change with `gh pr diff ${{ env.PR_NUMBER }}` and `gh pr view ${{ env.PR_NUMBER }}`;
            use a Jira key in the PR title/branch/body (e.g. KAN-5) as the test basis, otherwise
            the PR description and diff.

            Output rules for this CI run:
            - Post every bad-test finding that has a specific line as an inline comment with
              `mcp__github_inline_comment__create_inline_comment` (skill section 5).
            - Post ONE top-level summary comment with `gh pr comment ${{ env.PR_NUMBER }}` that has
              exactly the skill's two sections: "1. Bad tests" and "2. Missing tests"
              (write "None found" for an empty one).
            - Do not modify any files and do not push.
          claude_args: |
            --allowedTools "Skill,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Grep,Glob"
