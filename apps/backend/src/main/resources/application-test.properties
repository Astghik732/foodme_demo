spring.datasource.url=jdbc:h2:mem:foodme;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=foodme
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.open-in-view=false

spring.flyway.enabled=false
foodme.images.seed-enabled=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

foodme.jwt.secret=test-secret
foodme.jwt.issuer=foodme-backend-test
foodme.internal.api-key=test-key

sentry.dsn=

# Keep the suite fast and deterministic: no simulated request latency.
# (The flaky heartbeat job is disabled entirely under the test profile.)
foodme.latency.min-ms=0
foodme.latency.max-ms=0
