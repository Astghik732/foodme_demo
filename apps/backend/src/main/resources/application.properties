spring.application.name=foodme-backend

# Render/Koyeb set PORT; local/docker default remains 8081.
server.port=${PORT:8081}

# Prefer a full JDBC URL when set (Neon: jdbc:postgresql://.../neondb?sslmode=require).
# Students can instead paste a Neon URI as DATABASE_URL=postgresql://… (auto-converted).
# Otherwise fall back to discrete DB_* parts used by docker-compose.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodme}}
spring.datasource.username=${DB_USER:foodme}
spring.datasource.password=${DB_PASSWORD:foodme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Comma-separated browser origins. Use * on free-tier cloud lab so students
# do not have to reconfigure CORS after creating Vercel URLs.
foodme.cors.allowed-origins=${FOODME_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174,http://localhost:5180}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=foodme
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.schemas=foodme
spring.flyway.default-schema=foodme
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=0.2
sentry.environment=${SENTRY_ENVIRONMENT:local}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# FM-VULN-04
foodme.jwt.secret=foodme-super-secret-signing-key-change-me
foodme.jwt.issuer=foodme-backend

# FM-VULN-08
foodme.internal.api-key=fm_internal_9c1a7e2b3d4f4a5c8e6d1b2a3c4d5e6f

logging.config=classpath:logback-spring.xml
