spring.application.name=foodme-backend

server.port=8081

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foodme}
spring.datasource.username=${DB_USER:foodme}
spring.datasource.password=${DB_PASSWORD:foodme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=foodme
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.schemas=foodme
spring.flyway.default-schema=foodme
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=0.2
sentry.environment=${SENTRY_ENVIRONMENT:local}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# FM-VULN-04
foodme.jwt.secret=foodme-super-secret-signing-key-change-me
foodme.jwt.issuer=foodme-backend

# FM-VULN-08
foodme.internal.api-key=fm_internal_9c1a7e2b3d4f4a5c8e6d1b2a3c4d5e6f

logging.config=classpath:logback-spring.xml
