name: foodme

# ---------------------------------------------------------------------------
# FoodMe infrastructure — three profiles:
#   core           postgres, backend, web, admin
#   observability  prometheus, loki, promtail, grafana, glitchtip (+deps)
#   ci             jenkins
#
# Usage (run from repo root or infra/, paths below assume repo root):
#   docker compose -f infra/docker-compose.yml --profile core up -d
#   docker compose -f infra/docker-compose.yml --profile observability up -d
#   docker compose -f infra/docker-compose.yml --profile ci up -d
#   docker compose -f infra/docker-compose.yml --profile core --profile observability --profile ci config
#
# All services load the shared root .env (copy .env.example -> .env first).
# ---------------------------------------------------------------------------

x-env-file: &env-file
  - ../.env

services:
  # --------------------------------------------------------------------- #
  # core
  # --------------------------------------------------------------------- #
  postgres:
    image: postgres:16
    container_name: foodme-postgres
    profiles: ["core"]
    restart: unless-stopped
    env_file: *env-file
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-foodme}
      POSTGRES_USER: ${POSTGRES_USER:-foodme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foodme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foodme} -d ${POSTGRES_DB:-foodme}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [foodme]

  # Chef/dish pictures live in Postgres (foodme.image) and are served by the
  # backend at /api/images/** — no separate object-storage service needed.
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: foodme-backend
    profiles: ["core"]
    restart: unless-stopped
    env_file: *env-file
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-foodme}
      DB_USER: ${DB_USER:-foodme}
      DB_PASSWORD: ${DB_PASSWORD:-foodme}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Browser origins allowed to call the API. Override when running the
      # storefront/admin on non-default host ports (see docker-compose.local.yml).
      FOODME_CORS_ALLOWED_ORIGINS: ${FOODME_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174,http://localhost:5180}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [foodme]

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: foodme-web
    profiles: ["core"]
    restart: unless-stopped
    env_file: *env-file
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks: [foodme]

  admin:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: foodme-admin
    profiles: ["core"]
    restart: unless-stopped
    env_file: *env-file
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks: [foodme]

  # --------------------------------------------------------------------- #
  # observability
  # --------------------------------------------------------------------- #
  prometheus:
    image: prom/prometheus:latest
    container_name: foodme-prometheus
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [foodme]

  loki:
    image: grafana/loki:latest
    container_name: foodme-loki
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [foodme]

  promtail:
    image: grafana/promtail:latest
    container_name: foodme-promtail
    profiles: ["observability"]
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    networks: [foodme]

  grafana:
    image: grafana/grafana:latest
    container_name: foodme-grafana
    profiles: ["observability"]
    restart: unless-stopped
    env_file: *env-file
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
      - loki
    networks: [foodme]

  # GlitchTip — Sentry-API-compatible error tracker.
  # DSNs are only known after the first-run web UI setup; see .env.example
  # for the step-by-step to obtain them and paste into .env.
  glitchtip-postgres:
    image: postgres:16
    container_name: foodme-glitchtip-postgres
    profiles: ["observability"]
    restart: unless-stopped
    env_file: *env-file
    environment:
      POSTGRES_DB: ${GLITCHTIP_POSTGRES_DB:-glitchtip}
      POSTGRES_USER: ${GLITCHTIP_POSTGRES_USER:-glitchtip}
      POSTGRES_PASSWORD: ${GLITCHTIP_POSTGRES_PASSWORD:-glitchtip}
    volumes:
      - glitchtip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GLITCHTIP_POSTGRES_USER:-glitchtip} -d ${GLITCHTIP_POSTGRES_DB:-glitchtip}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [foodme]

  glitchtip-redis:
    image: redis:7
    container_name: foodme-glitchtip-redis
    profiles: ["observability"]
    restart: unless-stopped
    networks: [foodme]

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    container_name: foodme-glitchtip-web
    profiles: ["observability"]
    restart: unless-stopped
    env_file: *env-file
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-to-a-random-string}
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:-postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip}
      REDIS_URL: ${GLITCHTIP_REDIS_URL:-redis://glitchtip-redis:6379/0}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      ENABLE_USER_REGISTRATION: ${ENABLE_USER_REGISTRATION:-true}
      PORT: "8000"
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    ports:
      - "8000:8000"
    networks: [foodme]

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: foodme-glitchtip-worker
    profiles: ["observability"]
    restart: unless-stopped
    env_file: *env-file
    command: ["./bin/run-celery-with-beat.sh"]
    environment:
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-to-a-random-string}
      DATABASE_URL: ${GLITCHTIP_DATABASE_URL:-postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip}
      REDIS_URL: ${GLITCHTIP_REDIS_URL:-redis://glitchtip-redis:6379/0}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_started
    networks: [foodme]

  # --------------------------------------------------------------------- #
  # ci
  # --------------------------------------------------------------------- #
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: foodme-jenkins
    profiles: ["ci"]
    restart: unless-stopped
    env_file: *env-file
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc_configs/jenkins.yaml
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-admin}
    volumes:
      - jenkins-data:/var/jenkins_home
      - ./jenkins/jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ..:/workspace/foodme:ro
    ports:
      - "8080:8080"
      - "50000:50000"
    networks: [foodme]

networks:
  foodme:
    name: foodme

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
  grafana-data:
  glitchtip-postgres-data:
  jenkins-data:
