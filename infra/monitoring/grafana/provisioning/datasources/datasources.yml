apiVersion: 1

# On Render's FREE plan, web services cannot RECEIVE private-network traffic, so
# Grafana reaches Prometheus and Loki over their PUBLIC URLs. The urls below are
# filled from environment variables at Grafana startup (Grafana expands ${VAR}
# in provisioning files). Set these on the Grafana service in Render:
#   PROMETHEUS_URL = https://foodme-prometheus-xxxx.onrender.com
#   LOKI_URL       = https://foodme-loki-xxxx.onrender.com
# (no trailing slash). See infra/monitoring/README.md.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Fixed uid so provisioned dashboards can reference this datasource.
    uid: prometheus
    url: ${PROMETHEUS_URL}
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: ${LOKI_URL}
    editable: false
