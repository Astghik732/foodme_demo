global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Backend metrics over its PUBLIC Render URL. On Render's FREE plan, web
  # services cannot RECEIVE private-network traffic, so the private hostname
  # (foodme-...:10000) does not work — we scrape the public URL instead.
  # See infra/monitoring/README.md.
  #
  # __BACKEND_HOST__ is substituted at container start from the BACKEND_HOST env
  # var (see Dockerfile). Set BACKEND_HOST on the foodme-prometheus service to
  # your backend's public host — no scheme, no port, e.g.
  #   foodme-<username>-xxxx.onrender.com
  # (Scraping the public URL every 15s also keeps the free backend awake.)
  - job_name: foodme-backend
    metrics_path: /actuator/prometheus
    scheme: https
    static_configs:
      - targets: ["__BACKEND_HOST__:443"]
        labels:
          app: foodme-backend
