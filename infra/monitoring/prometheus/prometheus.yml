global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: foodme-backend
    metrics_path: /actuator/prometheus
    scheme: http
    static_configs:
      # Backend private hostname = its Render service name.
      # MUST match the backend service `name` in render.yaml (rename together).
      # Port = the port the backend binds on Render (default 10000).
      - targets: ["foodme-armanayvazyan:10000"]
        labels:
          app: foodme-backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
