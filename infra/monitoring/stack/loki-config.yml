auth_enabled: false

server:
  # Fixed loopback port — nginx owns Render's $PORT and proxies /loki/ here.
  http_listen_port: 3100
  http_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  grpc_listen_address: 127.0.0.1

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  reject_old_samples: false
  # Free instances have ~512MB shared across five processes; keep Loki modest.
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  # Drop logs older than 2 days. Must be a multiple of the 24h index period.
  retention_period: 48h

# Retention is only ENFORCED if the compactor runs with retention_enabled;
# limits_config.retention_period alone deletes nothing.
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  # Shorten the default 2h grace period so a short-lived free instance
  # actually gets around to deleting before it spins down.
  retention_delete_delay: 10m
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
