apiVersion: 1

# Everything runs in this same container, so both datasources are loopback and
# need NO environment variables — this is the wiring the consolidation removed.
# Prometheus is served under its --web.route-prefix=/prom.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Fixed uid so provisioned dashboards can reference this datasource.
    uid: prometheus
    url: http://127.0.0.1:9090/prom
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    uid: loki
    url: http://127.0.0.1:3100
    editable: false
