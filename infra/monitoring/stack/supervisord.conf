; Five processes in one free Render instance. Logs go to stdout/stderr so they
; land in Render's log stream; autorestart keeps a crashed component from
; silently taking the stack down.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

; Lets `docker exec ... supervisorctl status` work for debugging.
[unix_http_server]
file=/run/supervisord.sock

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:prometheus]
command=/usr/local/bin/prometheus
    --config.file=/tmp/prometheus.yml
    --storage.tsdb.path=/prometheus
    --storage.tsdb.retention.time=48h
    --storage.tsdb.retention.size=256MB
    --web.listen-address=127.0.0.1:9090
    --web.route-prefix=/prom
    --web.external-url=/prom
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:loki]
command=/usr/local/bin/loki -config.file=/etc/foodme/loki-config.yml
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:grafana]
command=/run.sh
environment=GF_SERVER_HTTP_PORT="3000",GF_PATHS_PROVISIONING="/etc/grafana/provisioning"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Talks to Grafana over loopback, so GRAFANA_URL needs no wiring. The service
; account token stays optional — unset just means the MCP can't query Grafana.
[program:mcp]
command=/usr/local/bin/mcp-grafana -transport streamable-http -address 127.0.0.1:8000 -allowed-hosts *
environment=GRAFANA_URL="http://127.0.0.1:3000"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Started last; it is the only process bound to the public $PORT.
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
