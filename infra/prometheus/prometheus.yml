global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: foodme-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8081"]
        labels:
          service: foodme-backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
