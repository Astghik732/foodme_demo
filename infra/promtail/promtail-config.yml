server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Label every log stream with the container name (strip the
      # leading slash Docker prefixes to container names).
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - source_labels: [__meta_docker_container_id]
        target_label: container_id

    pipeline_stages:
      # Backend emits structured JSON logs (logstash-logback-encoder).
      # Parse them and promote `level` / `logger` to Loki labels so
      # they're filterable without touching the log line itself.
      - json:
          expressions:
            level: level
            logger: logger_name
      - labels:
          level:
          logger:
