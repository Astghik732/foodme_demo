# FoodMe monitoring stack — SEPARATE blueprint, deploy AFTER the main app.
# Apply this into the SAME Render project + region as the app so private
# networking (service-name DNS) resolves. All services are free/ephemeral and
# never auto-redeploy on app code pushes (autoDeploy: false).
#
# NOTE: Render's FREE plan does not offer private services (pserv), so every
# service here is a "web" service. Prometheus/Loki are still reached internally
# via private DNS (foodme-prometheus:PORT / foodme-loki:PORT), but on free they
# also expose a public URL. For truly private Prometheus/Loki, switch those two
# to `type: pserv` on a paid plan (plan: starter).
#
# Internal URLs are wired by SERVICE NAME. If you rename a service, update every
# reference: datasources.yml, the backend LOKI_PUSH_URL, and GRAFANA_URL below.

services:
  # --- Prometheus -----------------------------------------------------------
  - type: web
    name: foodme-prometheus
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: false
    dockerfilePath: ./infra/monitoring/prometheus/Dockerfile
    dockerContext: ./infra/monitoring/prometheus
    healthCheckPath: /-/healthy

  # --- Loki -----------------------------------------------------------------
  - type: web
    name: foodme-loki
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: false
    dockerfilePath: ./infra/monitoring/loki/Dockerfile
    dockerContext: ./infra/monitoring/loki
    healthCheckPath: /ready

  # --- Grafana --------------------------------------------------------------
  - type: web
    name: foodme-armanayvazyan-grafana
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: false
    dockerfilePath: ./infra/monitoring/grafana/Dockerfile
    dockerContext: ./infra/monitoring/grafana
    healthCheckPath: /api/health
    envVars:
      - key: GF_SECURITY_ADMIN_PASSWORD
        sync: false
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"

  # --- Grafana MCP (serves metrics + logs + dashboards) ---------------------
  - type: web
    name: foodme-grafana-mcp
    runtime: image
    plan: free
    region: oregon
    autoDeploy: false
    image:
      url: docker.io/grafana/mcp-grafana:1.5.1
    # -allowed-hosts "*" is required behind Render's TLS-terminating proxy
    # (Host header is the onrender.com domain, which the default policy rejects).
    dockerCommand: /bin/sh -c 'exec /app/mcp-grafana -transport streamable-http -address 0.0.0.0:$PORT -allowed-hosts "*"'
    healthCheckPath: /healthz
    envVars:
      # MUST match the foodme-armanayvazyan-grafana service `name` above (rename together).
      - key: GRAFANA_URL
        value: http://foodme-armanayvazyan-grafana:10000
      # Service-account token the MCP uses to call Grafana (queries Prometheus + Loki + dashboards)
      - key: GRAFANA_SERVICE_ACCOUNT_TOKEN
        sync: false
      # Bearer token callers MUST present (Authorization: Bearer ...) — the MCP
      # refuses to serve publicly without it. This is the public MCP's auth.
      - key: MCP_GRAFANA_SERVER_TOKEN
        sync: false
