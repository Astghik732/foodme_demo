# FoodMe monitoring stack — SEPARATE blueprint, deploy AFTER the main app,
# into the same region. All services are free/ephemeral and never auto-redeploy
# on app code pushes (autoDeploy: false).
#
# IMPORTANT — free tier has NO private networking you can receive on:
# Render's free web services can SEND private-network requests but cannot
# RECEIVE them, so private hostnames (foodme-loki:10000, etc.) do NOT work here.
# Every internal hop therefore uses the target's PUBLIC *.onrender.com URL,
# supplied per-deploy via the `sync: false` env vars below (each is unique to
# your deploy — copy it from that service's page in the Render dashboard):
#   foodme-prometheus  -> BACKEND_HOST  (your backend's public host, no scheme/port)
#   Grafana            -> PROMETHEUS_URL, LOKI_URL  (full https URLs)
#   foodme-grafana-mcp -> GRAFANA_URL   (Grafana's full https URL)
#   backend service    -> LOKI_PUSH_URL (Loki's https URL + /loki/api/v1/push)
# For hash-free private DNS instead, upgrade the receiving services to a paid
# plan (plan: starter) — then use foodme-<name>:10000 URLs. See README.

services:
  # --- Prometheus -----------------------------------------------------------
  - type: web
    name: foodme-prometheus
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: false
    dockerfilePath: ./infra/monitoring/prometheus/Dockerfile
    dockerContext: ./infra/monitoring/prometheus
    healthCheckPath: /-/healthy
    envVars:
      # Backend's PUBLIC host (no scheme, no port) — Prometheus scrapes it over
      # https because free web services can't be reached privately.
      # e.g. foodme-armanayvazyan-xxxx.onrender.com
      - key: BACKEND_HOST
        sync: false

  # --- Loki -----------------------------------------------------------------
  - type: web
    name: foodme-loki
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: false
    dockerfilePath: ./infra/monitoring/loki/Dockerfile
    dockerContext: ./infra/monitoring/loki
    healthCheckPath: /ready

  # --- Grafana --------------------------------------------------------------
  - type: web
    name: foodme-armanayvazyan-grafana
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: false
    dockerfilePath: ./infra/monitoring/grafana/Dockerfile
    dockerContext: ./infra/monitoring/grafana
    healthCheckPath: /api/health
    envVars:
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: admin
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      # PUBLIC URLs of Prometheus/Loki (free web services can't be reached
      # privately). Grafana expands these into datasources.yml at startup.
      # e.g. https://foodme-prometheus-xxxx.onrender.com
      - key: PROMETHEUS_URL
        sync: false
      # e.g. https://foodme-loki-xxxx.onrender.com
      - key: LOKI_URL
        sync: false

  # --- Grafana MCP (serves metrics + logs + dashboards) ---------------------
  - type: web
    name: foodme-grafana-mcp
    runtime: image
    plan: free
    region: oregon
    autoDeploy: false
    image:
      url: docker.io/grafana/mcp-grafana:1.5.1
    # -allowed-hosts "*" is required behind Render's TLS-terminating proxy
    # (Host header is the onrender.com domain, which the default policy rejects).
    dockerCommand: /bin/sh -c 'exec /app/mcp-grafana -transport streamable-http -address 0.0.0.0:$PORT -allowed-hosts "*"'
    healthCheckPath: /healthz
    envVars:
      # Grafana's PUBLIC URL (free web services can't be reached privately).
      # e.g. https://foodme-armanayvazyan-grafana-xxxx.onrender.com
      - key: GRAFANA_URL
        sync: false
      # Service-account token the MCP uses to call Grafana (queries Prometheus + Loki + dashboards)
      - key: GRAFANA_SERVICE_ACCOUNT_TOKEN
        sync: false
      # Bearer token callers MUST present (Authorization: Bearer ...) — the MCP
      # refuses to serve publicly without it. This is the public MCP's auth.
      - key: MCP_GRAFANA_SERVER_TOKEN
        sync: false
