databases:
  - name: foodme-db
    plan: free
    databaseName: foodme
    user: foodme

services:
  - type: web
    name: foodme-armanayvazyan
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodme-db
          property: connectionString
      - key: SENTRY_DSN
        sync: false
      # Frontend DSNs are read at build time (Vite). Render passes service env
      # vars into the Docker build as build args of the same name; the Dockerfile
      # maps each into the matching SPA build. Leave blank to disable.
      - key: VITE_SENTRY_DSN_WEB
        sync: false
      - key: VITE_SENTRY_DSN_ADMIN
        sync: false
      # Set AFTER render-monitoring.yaml is deployed, to Loki's PUBLIC push URL:
      # https://foodme-loki-xxxx.onrender.com/loki/api/v1/push
      # (empty = log shipping disabled, which is the correct state until Loki exists)
      # NOT the private http://foodme-loki:10000/... — free web services cannot
      # RECEIVE private network traffic, so that address never resolves. See README.
      - key: LOKI_PUSH_URL
        sync: false
