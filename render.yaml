databases:
  - name: foodme-db
    plan: free
    databaseName: foodme
    user: foodme

services:
  # --- One service serves everything on a single origin ------------------
  # The Docker image bundles the built storefront (at "/") and admin back
  # office (at "/backoffice") alongside the Spring Boot API. Because the SPAs
  # and the API share one host, there is no cross-service URL to resolve and
  # no CORS to configure — the same blueprint deploys cleanly for anyone,
  # regardless of the random *.onrender.com suffix Render assigns.
  - type: web
    name: foodme-backend-armanayvazyan
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodme-db
          property: connectionString
      - key: SENTRY_DSN
        sync: false
