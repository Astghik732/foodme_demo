databases:
  - name: foodme-db
    plan: free
    databaseName: foodme
    user: foodme

services:
  # --- Backend API (Spring Boot, Docker) ---------------------------------
  - type: web
    name: foodme-backend-armanayvazyan
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodme-db
          property: connectionString
      - key: FOODME_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: SENTRY_DSN
        sync: false

  # --- Storefront (static React) -----------------------------------------
  - type: web
    name: foodme-web-armanayvazyan
    runtime: static
    buildCommand: cd apps/web && npm ci && npm run build
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://foodme-backend-armanayvazyan.onrender.com
      - key: VITE_SENTRY_DSN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Admin back office (static React) ----------------------------------
  - type: web
    name: foodme-admin-armanayvazyan
    runtime: static
    buildCommand: cd apps/admin && npm ci && npm run build
    staticPublishPath: apps/admin/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://foodme-backend-armanayvazyan.onrender.com
      - key: VITE_SENTRY_DSN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
