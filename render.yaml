databases:
  - name: foodme-db
    plan: free
    databaseName: foodme
    user: foodme

services:
  - type: web
    name: foodme-armanayvazyan
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodme-db
          property: connectionString
      - key: SENTRY_DSN
        sync: false
