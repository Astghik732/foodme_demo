databases:
  - name: foodme-db
    plan: free
    databaseName: foodme
    user: foodme

services:
  # Each deployer sets this to foodme-<their-github-username>. It only names
  # the service and its *.onrender.com subdomain — because the SPAs and API
  # are same-origin, the exact name (and any random suffix Render adds on a
  # collision) has no effect on whether the app works.
  - type: web
    name: foodme-armanayvazyan
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: foodme-db
          property: connectionString
      - key: SENTRY_DSN
        sync: false
