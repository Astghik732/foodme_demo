# Optional Render Blueprint
# Students can also click through the dashboard (see docs/deployment.md).
# Free tier sleeps when idle — first request after sleep is slow.
services:
  - type: web
    name: foodme-backend
    runtime: docker
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: ./apps/backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FOODME_CORS_ALLOWED_ORIGINS
        value: "*"
